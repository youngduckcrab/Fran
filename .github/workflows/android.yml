name: Android APK

# 앱 코드나 공용 타입이 바뀔 때만 만든다. 서버만 고친 커밋에는 돌지 않는다.
on:
  push:
    paths:
      - 'app/**'
      - 'shared/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # shared 는 컴파일된 결과(dist)를 앱이 가져다 쓴다. 루트 설치가 그걸 만든다.
      - run: npm ci
      - run: npm ci
        working-directory: app

      - name: 타입 검사
        run: npx tsc --noEmit
        working-directory: app

      - name: 푸시 설정 넣기 (있을 때만)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "푸시 설정을 넣었다."
          else
            echo "GOOGLE_SERVICES_JSON 이 없어서 푸시 없이 만든다."
          fi
        working-directory: app

      - name: 안드로이드 프로젝트 만들기
        run: npx expo prebuild --platform android --no-install
        working-directory: app
        env:
          CI: '1'
          FRAN_VERSION_CODE: ${{ github.run_number }}

      - name: APK 만들기
        run: ./gradlew assembleRelease --no-daemon
        working-directory: app/android

      - name: 이름 붙이기
        run: cp app/android/app/build/outputs/apk/release/app-release.apk fran.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fran-apk
          path: fran.apk

      # 받기 쉬운 고정 주소를 위해 릴리스에도 올린다.
      # https://github.com/<저장소>/releases/download/android-latest/fran.apk
      - name: 태그를 이 커밋으로 옮기기
        run: |
          git tag -f android-latest
          git push -f origin android-latest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android 앱 (최신)
          body: |
            `fran.apk` 를 폰에 받아서 설치한다.
            "출처를 알 수 없는 앱 설치" 를 한 번 허용해야 한다.
            커밋 ${{ github.sha }} 에서 만들어졌다.
          prerelease: true
          files: fran.apk
