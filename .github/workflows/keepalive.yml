# 서버를 재우지 않기.
#
# 무료 호스팅은 한동안 아무도 안 들어오면 서버를 재우고, 다시 깨우는 데 수십 초가
# 걸린다. 10분마다 한 번씩 찔러 두면 잠들 틈이 없다.
#
# 켜는 법: 저장소 Settings → Secrets and variables → Actions → Variables 에
#   APP_URL = https://내주소.onrender.com
# 을 넣는다. 넣기 전까지는 아무것도 하지 않고 조용히 끝난다.
#
# 알아 둘 것:
#   - Render 무료 등급은 한 달에 750시간을 준다. 한 달이 730시간이라 하나짜리
#     서비스는 딱 맞지만, 무료 서비스를 두 개 이상 돌리고 있다면 모자란다.
#   - GitHub 의 예약 실행은 붐빌 때 밀리거나 걸러진다. 확실하게 하려면
#     cron-job.org 나 UptimeRobot 같은 데서 같은 주소를 찌르는 쪽이 낫다.
#   - 저장소에 두 달 넘게 아무 커밋도 없으면 GitHub 이 예약 실행을 멈춘다.

name: Keep alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# 앞 회차가 아직 돌고 있으면 건너뛴다. 깨우는 게 목적이라 겹칠 이유가 없다.
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 서버 깨우기
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL 변수가 없습니다. 저장소 Variables 에 넣으면 그때부터 동작합니다."
            exit 0
          fi
          # 자고 있던 서버는 깨어나는 데 시간이 걸린다. 넉넉히 기다려 준다.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$APP_URL/healthz" || echo 000)
          echo "$APP_URL/healthz → $code"
          # 실패해도 빨간 X 를 남기지 않는다. 다음 회차가 10분 뒤에 또 온다.
          exit 0
